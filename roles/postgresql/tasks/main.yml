- name: Install PostgreSQL Common
  ansible.builtin.apt:
    name: postgresql-common

- name: Install PostgreSQL Apt Repository
  ansible.builtin.deb822_repository:
    name: pgdg
    uris: https://apt.postgresql.org/pub/repos/apt
    components: main
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    signed_by: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
    state: present

- name: Install PostgreSQL 16
  ansible.builtin.apt:
    name: postgresql-16
    update-cache: true

- name: Install psycopg2
  ansible.builtin.apt:
    name: python3-psycopg2

- name: Create Paul User
  community.postgresql.postgresql_user:
    name: paul
    password: "{{ postgres_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    state: present
  become_user: postgres

- name: Copy pg_hba.conf file
  ansible.builtin.copy:
    src: pg_hba.conf
    dest: /etc/postgresql/16/main/pg_hba.conf
  notify: Restart PostgreSQL Server

- name: Copy PostgreSQL configuration file
  ansible.builtin.copy:
    src: postgresql.conf
    dest: /etc/postgresql/16/main/postgresql.conf
  notify: Restart PostgreSQL Server

- name: Create Paul Database
  community.postgresql.postgresql_db:
    name: paul
    owner: paul
    state: present
  become_user: postgres

- name: Copy database schema
  ansible.builtin.copy:
    src: schema.sql
    dest: /tmp/schema.sql
    mode: "0644"
  notify: Apply schema
